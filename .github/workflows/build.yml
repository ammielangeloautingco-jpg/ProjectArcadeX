name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update && sudo apt-get install -y repo git-core gnupg flex bison build-essential ccache libssl-dev

      - name: Initialize Repo & Sync
        run: |
          mkdir workspace && cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd workspace
          git clone https://gitlab.com/archer37-th/android_device_samsung_b5q.git -b android-12.1 device/samsung/b5q

      - name: Build Recovery Image
        run: |
          cd workspace
          source build/envsetup.sh
          lunch twrp_b5q-eng || lunch omni_b5q-eng
          make recoveryimage -j$(nproc --all)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Recovery-b5q
          path: workspace/out/target/product/b5q/recovery.img
          
